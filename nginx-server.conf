server {
    # Listen on port 80
    listen 80;
    server_name localhost;

    # Hide nginx version etc.
    server_tokens off;

    # This should be the default path anyway, but putting it here anyway...
    root /usr/share/nginx/html/;

    # NGINX performance optimizations
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    # Make sure the following headers are preserved when calling add_header in more specific contexts.
    # WARNING: This requires nginx 1.29 and above.
    # Security headers will be lost in earlier versions and the configuration must be updated appropriately!!!
    add_header_inherit merge;

    # Security stuff with pretty strict permissions. May need to adjust depending on your use case.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Root URL shows index.html
    location = / {
        try_files /index.html =404;
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Redirect accesses to /index.html to root and resolve index.html from there
    location = /index.html {
        return 301 /;
    }

    # Allow access to the stylesheet
    location = /style.css {
        try_files /style.css =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Allow access to everything in the subscription directory
    location /sub/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Do not allow access to anything else
    location / {
        return 404;
    }
}
